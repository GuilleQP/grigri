# kagent's BYO example running as a Harness on a local Kind cluster.
# ${IMAGE} is filled in by `make deploy` (image pinned by digest).
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: grigri
  namespace: kagent
spec:
  byo: {}
  workload:
    image: ${IMAGE}
    command: ["/app"]
  env:
  # kagent#2758: BYO sets no port but advertises :80. Same workaround as
  # kagent's own E2E manifests (byo-adk-e2e).
  - name: KAGENT_PORT
    value: "80"
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: grigri-example
  namespace: kagent
spec:
  description: grigri example agent
  systemPrompt: You are the climber. Do the work one pitch at a time.
  # Referenced so the compiler adds OpenAI credentials and egress for it.
  modelConfig:
    name: default-model-config
  tools:
  # A Shared subagent: compiled into this Agent's config (sub_agents) and run
  # by the same harness, in the same Actor.
  - subAgent:
      name: belayer
      description: Reviews risky steps and checks the work stays on route.
      templateRef:
        name: grigri-belayer
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: grigri-belayer
  namespace: kagent
spec:
  description: Reviews risky steps and checks the work stays on route.
  systemPrompt: You are the belayer. Answer only with a belay call and a reason.
  modelConfig:
    name: default-model-config
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: grigri-example
  namespace: kagent
spec:
  templateRef:
    name: grigri-example
  harnessRef:
    name: grigri
