# kagent's BYO example running as a Harness on a local Kind cluster.
# ${IMAGE} is filled in by `make deploy` (image pinned by digest).
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: grigri
  namespace: kagent
spec:
  byo: {}
  workload:
    image: ${IMAGE}
    command: ["/app"]
  env:
  # kagent#2758: BYO sets no port but advertises :80. Same workaround as
  # kagent's own E2E manifests (byo-adk-e2e).
  - name: KAGENT_PORT
    value: "80"
  # Tools that get a belay check before they run (glob patterns). The climber
  # cannot skip these checks.
  - name: GRIGRI_BELAY_TOOLS
    value: "k8s_delete_*,k8s_scale,k8s_rollout,k8s_patch_*"
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: grigri-example
  namespace: kagent
spec:
  description: grigri example agent
  systemPrompt: |
    You are the climber: you operate Kubernetes for the user with your tools.
    Work only in the namespace grigri-playground; treat it as production.
    Some tools are reviewed by a belayer before they run. If a tool result
    says it was blocked, do not retry it: tell the user the reason and
    suggest a safer alternative. For risky steps you cannot do with a tool,
    call watch_me first and follow the verdict.
  # Referenced so the compiler adds OpenAI credentials and egress for it.
  modelConfig:
    name: default-model-config
  tools:
  - mcp:
      server:
        kind: RemoteMCPServer
        name: kagent-tool-server
      tools:
      - k8s_get_resources
      - k8s_describe_resource
      - k8s_get_pod_logs
      - k8s_get_events
      - k8s_scale
      - k8s_rollout
      - k8s_delete_resource
  # A Shared subagent: compiled into this Agent's config (sub_agents) and run
  # by the same harness, in the same Actor. grigri turns the one named
  # "belayer" into the climber's watch_me tool instead of a transfer target.
  - subAgent:
      name: belayer
      description: Reviews risky steps and checks the work stays on route.
      templateRef:
        name: grigri-belayer
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: grigri-belayer
  namespace: kagent
spec:
  description: Reviews risky steps and checks the work stays on route.
  # How to judge. The answer format (a belay call as JSON) comes from grigri's
  # brief, not from this prompt.
  systemPrompt: |
    You are the belayer. You review one proposed step at a time and decide
    whether the climber may take it. Treat the namespace grigri-playground as
    production: its name does not make a step safe. Approve steps that are reversible or low
    impact. Block steps that risk data loss or an outage in production, or
    that do more than the user's request needs; say what would be safer.
  modelConfig:
    name: default-model-config
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: grigri-example
  namespace: kagent
spec:
  templateRef:
    name: grigri-example
  harnessRef:
    name: grigri
